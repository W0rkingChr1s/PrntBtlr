[project]
name = "prntbtlr"
version = "0.3.1"
description = "PrntBtlr — a web server for Raspberry Pi that turns an old USB printer into a managed AirPrint + button-scan station with a friendly control panel."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # jinja2 <3.1.6 is vulnerable to CVE-2024-22195 (xmlattr XSS), CVE-2024-56326
    # and CVE-2025-27516 (sandbox breakout / RCE via str.format and |attr).
    "jinja2>=3.1.6",
    # python-multipart <0.0.18 is vulnerable to CVE-2024-53981 (DoS via boundary
    # padding). Newer fixes (CVE-2026-42561, CVE-2026-53539 — high-severity DoS)
    # require python-multipart>=0.0.27/0.0.30, which need Python>=3.10 and can't
    # be reached while requires-python stays >=3.9 (Raspberry Pi OS Bullseye).
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.2",
    "itsdangerous>=2.1",
]

[project.scripts]
prntbtlr = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
