[project]
name = "prntbtlr"
version = "0.3.1"
description = "PrntBtlr — a web server for Raspberry Pi that turns an old USB printer into a managed AirPrint + button-scan station with a friendly control panel."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    # fastapi/uvicorn/pydantic-settings/python-multipart/starlette version floors are
    # split by Python version to close known CVEs on 3.10+ while keeping the newest
    # 3.9-compatible release installable (Raspberry Pi OS Bullseye) - see requirements.txt
    # for the full CVE list and rationale.
    "fastapi>=0.141.1; python_version >= '3.10'",
    "fastapi>=0.110,<=0.128.8; python_version < '3.10'",
    "uvicorn[standard]>=0.52.4; python_version >= '3.10'",
    "uvicorn[standard]>=0.29,<=0.39.0; python_version < '3.10'",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32; python_version >= '3.10'",
    "python-multipart>=0.0.9,<=0.0.20; python_version < '3.10'",
    "pydantic-settings>=2.15.0; python_version >= '3.10'",
    "pydantic-settings>=2.2,<=2.11.0; python_version < '3.10'",
    "itsdangerous>=2.2",
    "starlette>=1.6.0; python_version >= '3.10'",
    "starlette>=0.36.3,<=0.49.3; python_version < '3.10'",
]

[project.scripts]
prntbtlr = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
# setuptools>=83.0.0 fixes PYSEC-2026-3447 (Unicode-normalization bypass of
# MANIFEST.in exclude/prune rules when building sdists on macOS APFS/HFS+).
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"
